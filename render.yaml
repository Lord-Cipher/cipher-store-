services:
  - type: web
    name: cipher-store
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OXAPAY_MERCHANT_API_KEY
        sync: false
      - key: OXAPAY_SANDBOX
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SUPABASE_URL
        value: "https://ozhejjbfmltmimmzwpdv.supabase.co"
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
